[pytest]
testpaths = tests
# Known bugs are pinned with xfail; strict means a fixed bug fails the run until its marker is removed.
xfail_strict = true
addopts = -ra -m "not scale"
markers =
    gui: builds the Tk application (skipped automatically when no display is available)
    slow: spawns Python subprocesses or trains an example model
    scale: 100k-row run, opt in with `pytest -m scale` (excluded by default)
