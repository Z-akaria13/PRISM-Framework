[build-system]
requires = ["setuptools>=77"]  # 77: the licence as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "prism-audit"
dynamic = ["version"]
description = "Audit a trained model for demographic bias and shortcut learning: subgroup performance, linear probes of hidden layers, and an error gallery."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Zakaria" }]
requires-python = ">=3.10"
# What PRISM itself imports. A model's framework comes from an extra (or is already installed).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.2",
    "scipy>=1.11",
    "h5py>=3.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
keras = ["tensorflow>=2.12"]
# What the examples in examples/ need, which the test suite also runs.
examples = ["torch>=2.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools.dynamic]
version = { attr = "prism.__version__" }

[tool.setuptools.packages.find]
include = ["prism*"]
